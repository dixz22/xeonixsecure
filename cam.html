<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeonix Camera</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #0b0f19;
  --bg-card: #111827;
  --border: #1f2937;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
}

header {
  background: rgba(17, 24, 39, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 20px;
  text-align: center;
  font-weight: 700;
  font-size: 18px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}

.container {
  padding: 32px 24px;
  max-width: 800px;
  margin: 0 auto;
  display: grid;
  gap: 24px;
}

@media (min-width: 768px) {
  .container { grid-template-columns: 300px 1fr; align-items: start; }
}

.card {
  background: var(--bg-card);
  padding: 24px;
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.card h3 {
  margin: 0 0 20px 0;
  color: var(--text-muted);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.btn-group { display: flex; gap: 10px; margin-bottom: 20px; }

button {
  flex: 1;
  padding: 14px 16px;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  transition: all 0.2s;
}
button:hover { filter: brightness(1.1); transform: translateY(-1px); }
button:active { transform: translateY(0); }

.info { background: #1f2937; color: var(--text-muted); border-color: #374151; }
.primary { background: var(--primary); color: white; width: 100%; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }

/* Logic Active Class Overrides */
.modeActive { background: var(--text-main) !important; color: #000 !important; border-color: var(--text-main) !important; }

.status {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 24px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
}

.preview {
  width: 100%;
  max-height: 500px;
  object-fit: cover;
  border-radius: 12px;
  background: #000;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.loading { color: var(--primary); font-weight: 500; margin-top: 15px; font-size: 14px;}
.success { color: var(--success); font-weight: 500; margin-top: 15px; font-size: 14px;}
.error { color: var(--danger); font-weight: 500; margin-top: 15px; font-size: 14px;}
p { color: var(--text-muted); font-size: 13px; margin-top: 12px; }

.back-btn-wrapper { grid-column: 1 / -1; }
.btn-back { background: transparent; border: 1px solid #374151; color: var(--text-main); box-shadow: none; }
.btn-back:hover { background: #1f2937; }
</style>
</head>
<body>

<header>Remote Optics</header>

<div class="container">

<div class="card">
<div id="deviceStatus" class="status">Checking connection...</div>
<div class="btn-group">
  <button id="frontBtn" class="info modeActive" onclick="selectFront()">Front</button>
  <button id="backBtn" class="info" onclick="selectBack()">Rear</button>
</div>
<button class="primary" onclick="capture()">Capture Frame</button>
<div id="cameraStatus"></div>
</div>

<div class="card">
<h3>Live Snapshot</h3>
<div id="previewArea" style="color: var(--text-muted); padding: 40px 0;">No active frames</div>
</div>

<div class="back-btn-wrapper">
<button class="primary btn-back" onclick="goBack()">Return to Dashboard</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC71owbERIUTdALLUeTILc9KTWYuZ5TNqQ",
  authDomain: "xeonix-e8b4d.firebaseapp.com",
  databaseURL: "https://xeonix-e8b4d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xeonix-e8b4d",
  storageBucket: "xeonix-e8b4d.firebasestorage.app",
  messagingSenderId: "1069914635197",
  appId: "1:1069914635197:web:69cfb35ca50b05ac5670d4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const deviceId="device1";

let selectedCamera = "user";
let waitingResponse = false;

function goBack(){ window.location.href="admin.html"; }

function selectFront(){
selectedCamera = "user";
document.getElementById("frontBtn").classList.add("modeActive");
document.getElementById("backBtn").classList.remove("modeActive");
document.getElementById("cameraStatus").innerHTML = "<div style='margin-top:15px; font-size:13px; color:var(--text-muted)'>Lens selected: Front</div>";
}

function selectBack(){
selectedCamera = "environment";
document.getElementById("backBtn").classList.add("modeActive");
document.getElementById("frontBtn").classList.remove("modeActive");
document.getElementById("cameraStatus").innerHTML = "<div style='margin-top:15px; font-size:13px; color:var(--text-muted)'>Lens selected: Rear</div>";
}

function capture(){
if(!waitingResponse){
waitingResponse = true;
document.getElementById("cameraStatus").innerHTML = "<div class='loading'>Processing request...</div>";
if(selectedCamera === "user"){ sendCommand("take_photo_front"); } else { sendCommand("take_photo_back"); }
setTimeout(()=>{
if(waitingResponse){
document.getElementById("cameraStatus").innerHTML = "<div class='error'>Connection timeout</div>";
waitingResponse = false;
}
},8000);
}
}

function sendCommand(cmd){ db.ref("devices/"+deviceId+"/command").set(cmd); }

db.ref("devices/"+deviceId+"/online").on("value",snap=>{
if(snap.val()){
document.getElementById("deviceStatus").innerHTML="Device Online";
document.getElementById("deviceStatus").style.color="var(--success)";
document.getElementById("deviceStatus").style.borderColor="rgba(16, 185, 129, 0.2)";
}else{
document.getElementById("deviceStatus").innerHTML="Device Offline";
document.getElementById("deviceStatus").style.color="var(--text-muted)";
document.getElementById("deviceStatus").style.borderColor="var(--border)";
}
});

db.ref("devices/"+deviceId+"/photos").limitToLast(1).on("value",snap=>{
snap.forEach(child=>{
let d=child.val();
waitingResponse = false;
document.getElementById("cameraStatus").innerHTML = "<div class='success'>Frame captured successfully</div>";
document.getElementById("previewArea").innerHTML = `<img src="${d.image}" class="preview"><p>${new Date(d.time).toLocaleString()}</p>`;
});
});
</script>

</body>
</html>
