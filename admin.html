<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeonix Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #0b0f19;
  --bg-card: #111827;
  --border: #1f2937;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --danger: #ef4444;
  --success: #10b981;
  --info: #8b5cf6;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  line-height: 1.6;
}

header {
  background: rgba(17, 24, 39, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 20px 24px;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
  text-align: center;
}

.container {
  padding: 32px 24px;
  max-width: 1200px;
  margin: 0 auto;
}

#loginBox {
  max-width: 400px;
  margin: 10vh auto;
}

#dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 24px;
}

.card {
  background: var(--bg-card);
  padding: 24px;
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  border-color: #374151;
}

.card h3 {
  margin: 0 0 20px 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

input[type="password"] {
  width: 100%;
  padding: 14px 16px;
  background: #0f172a;
  border: 1px solid var(--border);
  color: var(--text-main);
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 15px;
  margin-bottom: 20px;
  outline: none;
  transition: all 0.2s;
  font-family: inherit;
}
input[type="password"]:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin: 6px 0;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  transition: all 0.2s;
  width: 100%;
}
button:hover { filter: brightness(1.15); transform: translateY(-1px); }
button:active { transform: translateY(0); }

.primary { background: var(--primary); color: white; }
.danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
.danger:hover { background: var(--danger); color: white; }
.info { background: #1f2937; color: white; border: 1px solid #374151; }
.info:hover { background: #374151; }
.success { background: var(--success); color: white; }

.logout-btn { width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }

table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
th, td { border-bottom: 1px solid var(--border); padding: 12px 8px; text-align: left; }
th { color: var(--text-muted); font-weight: 500; width: 40%; }
td { font-weight: 500; color: #e2e8f0; }
tr:last-child th, tr:last-child td { border-bottom: none; }

.loading { color: var(--primary); font-weight: 500; margin-top: 12px; font-size: 14px; display: flex; align-items: center; gap: 8px;}
.successText { color: var(--success); font-weight: 500; margin-top: 12px; font-size: 14px; }
.errorText { color: var(--danger); font-weight: 500; margin-top: 12px; font-size: 14px; }
#statusText, #batteryText { font-size: 24px; font-weight: 700; letter-spacing: -0.5px;}

.full-width { grid-column: 1 / -1; }
@media (max-width: 768px) { .full-width { grid-column: auto; } }
</style>
</head>
<body>

<header>Xeonix Command Center</header>

<div class="container" id="loginBox">
<div class="card">
<h3>System Authentication</h3>
<input type="password" id="pw" placeholder="Enter master key">
<button class="primary" onclick="login()">Authenticate</button>
</div>
</div>

<div class="container" id="dashboard" style="display:none;">

<div class="card">
<h3>Status Device 
<button class="danger logout-btn" onclick="logoutAdmin()">Logout</button>
</h3>
<div id="statusText">Checking...</div>
</div>

<div class="card">
<h3>Power Level</h3>
<div id="batteryText">—</div>
</div>

<div class="card">
<h3>Media Controls</h3>
<button class="info" onclick="goCam()">Launch Camera UI</button>
<button class="info" onclick="goGallery()">View Media Gallery</button>
</div>

<div class="card">
<h3>Quick Map Navigation</h3>
<button id="btnOpenMaps" class="info" onclick="bukaGoogleMaps()" style="background: #1e293b; color: #94a3b8; border: 1px solid #334155; cursor: not-allowed; margin: 0;" disabled>
  🗺️ Awaiting Coordinates...
</button>
</div>

<div class="card">
<h3>Device Alert / Alarm</h3>
<div style="display: flex; gap: 10px;">
  <button class="danger" style="margin:0;" onclick="toggleAlarm(true)">🚨 Trigger Alarm</button>
  <button class="info" style="margin:0; background: #1f2937; border-color: #374151; color: var(--text-muted);" onclick="toggleAlarm(false)">Stop</button>
</div>
</div>

<div class="card">
<h3>Location Tracking</h3>
<button class="primary" onclick="ambilPosisi()">Request Coordinates</button>
<div id="gpsStatus"></div>
</div>

<div class="card full-width">
<h3>Latest GPS Data</h3>
<div id="gpsData" style="color:var(--text-muted); font-size:14px; padding-top:10px;">Awaiting data synchronization...</div>
</div>

<div class="card">
<h3>Device Management</h3>
<button class="danger" onclick="logoutDevice()">Force Logout Target</button>
</div>

<div class="card">
<h3>System Maintenance</h3>
<button class="danger" onclick="resetFirebase()">Wipe Database</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC71owbERIUTdALLUeTILc9KTWYuZ5TNqQ",
  authDomain: "xeonix-e8b4d.firebaseapp.com",
  databaseURL: "https://xeonix-e8b4d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xeonix-e8b4d",
  storageBucket: "xeonix-e8b4d.firebasestorage.app",
  messagingSenderId: "1069914635197",
  appId: "1:1069914635197:web:69cfb35ca50b05ac5670d4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const deviceId="device1";
let waitingGPS=false;

// Variabel untuk menyimpan lokasi terkini
let lastLat = null;
let lastLon = null;

function login(){
if(document.getElementById("pw").value==="xeonix"){
localStorage.setItem("xeonix_logged","true");
showDashboard();
}else{ alert("Password salah"); }
}
function showDashboard(){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="grid";
}
function logoutAdmin(){
localStorage.removeItem("xeonix_logged"); location.reload();
}
if(localStorage.getItem("xeonix_logged")==="true"){ showDashboard(); }

// FUNGSI ALARM
function toggleAlarm(start) {
  let cmd = start ? "trigger_alarm_start" : "trigger_alarm_stop";
  db.ref("devices/"+deviceId+"/command").set(cmd);
}

// FUNGSI GOOGLE MAPS
function bukaGoogleMaps() {
  if(lastLat && lastLon) {
    window.open(`https://www.google.com/maps?q=${lastLat},${lastLon}`, '_blank');
  }
}

function ambilPosisi(){
if(waitingGPS) return;
waitingGPS=true;
document.getElementById("gpsStatus").innerHTML="<div class='loading'>📡 Synchronizing location...</div>";
db.ref("devices/"+deviceId+"/command").set("get_location");
setTimeout(()=>{
if(waitingGPS){
document.getElementById("gpsStatus").innerHTML="<div class='errorText'>Timeout: Failed to acquire fix</div>";
waitingGPS=false;
}
},10000);
}

db.ref("devices/"+deviceId+"/gpsHistory").limitToLast(1).on("value",snap=>{
snap.forEach(child=>{
let d=child.val();
waitingGPS=false;

// Menyimpan koordinat & mengaktifkan tombol Maps
lastLat = d.lat;
lastLon = d.lon;
let btnMaps = document.getElementById("btnOpenMaps");
btnMaps.disabled = false;
btnMaps.style.background = "var(--primary)";
btnMaps.style.color = "white";
btnMaps.style.borderColor = "var(--primary)";
btnMaps.style.cursor = "pointer";
btnMaps.innerHTML = "🗺️ Open in Google Maps";

document.getElementById("gpsStatus").innerHTML="<div class='successText'>Location acquired ✔</div>";
document.getElementById("gpsData").innerHTML=`
<table>
<tr><th>Latitude</th><td>${d.lat}</td></tr>
<tr><th>Longitude</th><td>${d.lon}</td></tr>
<tr><th>Accuracy</th><td>± ${d.accuracy} m</td></tr>
<tr><th>Desa</th><td>${d.desa}</td></tr>
<tr><th>Kecamatan</th><td>${d.kecamatan}</td></tr>
<tr><th>Kabupaten</th><td>${d.kabupaten}</td></tr>
<tr><th>Provinsi</th><td>${d.provinsi}</td></tr>
<tr><th>Timestamp</th><td>${new Date(d.time).toLocaleString()}</td></tr>
</table>
`;
});
});

db.ref("devices/"+deviceId+"/online").on("value",snap=>{
if(snap.val()){
document.getElementById("statusText").innerHTML="Online";
document.getElementById("statusText").style.color="var(--success)";
}else{
document.getElementById("statusText").innerHTML="Offline";
document.getElementById("statusText").style.color="var(--text-muted)";
}
});

db.ref("devices/"+deviceId+"/battery").on("value",snap=>{
let b=snap.val();
if(!b){ document.getElementById("batteryText").innerHTML="—"; return; }
document.getElementById("batteryText").innerHTML= b.level+"% <span style='font-size:16px;color:var(--text-muted)'>"+(b.charging ? " ⚡ Charging" : "")+"</span>";
});

function logoutDevice(){
if(confirm("Logout perangkat target?")){ db.ref("devices/"+deviceId+"/command").set("force_logout"); }
}

function goCam(){ window.location.href="cam.html"; }
function goGallery(){ window.location.href="galeri.html"; }

function resetFirebase(){
if(confirm("Hapus seluruh foto dan riwayat lokasi? (Perangkat target tidak akan ter-logout)")){
  db.ref("devices/"+deviceId+"/photos").remove();
  db.ref("devices/"+deviceId+"/gpsHistory").remove();
  
  // Reset UI Peta
  lastLat = null; lastLon = null;
  let btnMaps = document.getElementById("btnOpenMaps");
  btnMaps.disabled = true;
  btnMaps.style.background = "#1e293b"; btnMaps.style.color = "#94a3b8";
  btnMaps.style.borderColor = "#334155"; btnMaps.style.cursor = "not-allowed";
  btnMaps.innerHTML = "🗺️ Awaiting Coordinates...";

  document.getElementById("gpsData").innerHTML="<div style='color:var(--text-muted); font-size:14px; padding-top:10px;'>Data telah dibersihkan...</div>";
  alert("Database berhasil dibersihkan!");
}
}
</script>
</body>
</html>
